name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build backend executable (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller packaging/backend.spec --distpath packaging/dist --workpath packaging/build --noconfirm

      - name: Verify backend executable
        run: |
          if (-not (Test-Path packaging/dist/aihub-backend.exe)) { throw 'aihub-backend.exe missing' }
          Get-Item packaging/dist/aihub-backend.exe | Select-Object Name, Length

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop (electron-vite)
        working-directory: desktop
        run: npm run build

      # 不走 electron-builder 的 GitHub publish（此前多次在此失败）；只产出安装包 + latest.yml
      - name: Package Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      - name: List dist artifacts
        working-directory: desktop
        run: Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.yaml
            desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
