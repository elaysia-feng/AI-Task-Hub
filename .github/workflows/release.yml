name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build backend executable (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller packaging/backend.spec --distpath packaging/dist --workpath packaging/build --noconfirm

      - name: Verify backend executable
        run: |
          if (-not (Test-Path packaging/dist/aihub-backend.exe)) { throw 'aihub-backend.exe missing' }
          Get-Item packaging/dist/aihub-backend.exe | Select-Object Name, Length

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        # foreground-scripts：把 electron postinstall 日志打到 Actions 控制台，便于排查
        run: npm ci --foreground-scripts

      - name: Ensure Electron binary
        working-directory: desktop
        run: |
          $exe = 'node_modules/electron/dist/electron.exe'
          if (-not (Test-Path $exe)) {
            Write-Host 'electron.exe missing after npm ci — re-running install.js'
            node node_modules/electron/install.js
          }
          if (-not (Test-Path $exe)) { throw 'electron.exe still missing after install.js' }
          Get-Item $exe | Select-Object FullName, Length

      - name: Build desktop (electron-vite)
        working-directory: desktop
        run: npm run build

      - name: Package Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder
        run: |
          npx electron-builder --publish never -c.electronDist=node_modules/electron/dist > electron-builder.log 2>&1
          $code = $LASTEXITCODE
          Get-Content electron-builder.log
          if ($code -ne 0) { exit $code }

      - name: List dist artifacts
        if: always()
        working-directory: desktop
        run: |
          if (Test-Path dist) { Get-ChildItem dist -Recurse | Select-Object FullName, Length }
          else { Write-Host 'dist/ missing' }

      - name: Upload builder logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-logs
          path: |
            desktop/electron-builder.log
            desktop/dist/**
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.yaml
            desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
