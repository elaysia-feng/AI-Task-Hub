name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build backend executable (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller packaging/backend.spec --distpath packaging/dist --workpath packaging/build --noconfirm

      - name: Verify backend executable
        run: |
          if (-not (Test-Path packaging/dist/aihub-backend.exe)) { throw 'aihub-backend.exe missing' }
          Get-Item packaging/dist/aihub-backend.exe | Select-Object Name, Length

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop (electron-vite)
        working-directory: desktop
        run: npm run build

      - name: Package and publish GitHub Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 无代码签名证书：禁止自动探测，否则 electron-builder 会在签名步骤失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always
