name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # actions/checkout@v4 → SHA pin（2026-08）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-python@v5 → SHA pin（2026-08）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build backend executable (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller packaging/backend.spec --distpath packaging/dist --workpath packaging/build --noconfirm

      - name: Verify backend executable
        run: |
          if (-not (Test-Path packaging/dist/aihub-backend.exe)) { throw 'aihub-backend.exe missing' }
          Get-Item packaging/dist/aihub-backend.exe | Select-Object Name, Length

      # actions/setup-node@v4 → SHA pin（2026-08）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        # foreground-scripts：把 electron postinstall 日志打到 Actions 控制台，便于排查
        run: npm ci --foreground-scripts

      - name: Ensure Electron binary
        working-directory: desktop
        run: |
          $exe = 'node_modules/electron/dist/electron.exe'
          if (-not (Test-Path $exe)) {
            Write-Host 'electron.exe missing after npm ci — re-running install.js'
            node node_modules/electron/install.js
          }
          if (-not (Test-Path $exe)) { throw 'electron.exe still missing after install.js' }
          Get-Item $exe | Select-Object FullName, Length

      - name: Build desktop (electron-vite)
        working-directory: desktop
        run: npm run build

      - name: Package Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --publish never > electron-builder.log 2>&1
          $code = $LASTEXITCODE
          Get-Content electron-builder.log
          if ($code -ne 0) { exit $code }

      - name: List dist artifacts
        if: always()
        working-directory: desktop
        run: |
          if (Test-Path dist) { Get-ChildItem dist -Recurse | Select-Object FullName, Length }
          else { Write-Host 'dist/ missing' }

      - name: Upload builder logs on failure
        if: failure()
        # actions/upload-artifact@v4 → SHA pin（2026-08）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: electron-builder-logs
          path: |
            desktop/electron-builder.log
            desktop/dist/**
          if-no-files-found: warn

      # softprops/action-gh-release 已 pin 到 commit SHA 77fb938 (2026-08-04)
      # 旧 pin 2538c8b 为无效 SHA（该 commit 不存在），导致 Release 工作流在 "Set up job"
      # 阶段即失败。升级路径：定期跑 `git ls-remote https://github.com/softprops/action-gh-release.git refs/heads/main`
      # 找到新 SHA 后人工 review + 更新此处。
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@77fb938f2f95e717ce6705d2909af527263360a0
        with:
          draft: false
          generate_release_notes: true
          files: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.yaml
            desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
